<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home · Sneha’s Place</title>
    <meta
      name="description"
      content="Inside Sneha’s Place — the rooms where the work gets made."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=note-r4" />
  </head>
  <body class="page-house">
    <header class="site-header">
      <a class="logo" href="entrance.html"><img src="assets/logo-script.png" alt="Sneha’s Place" width="950" height="136" /></a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" aria-current="page">Home</a>
        <a href="work.html">Work</a>
        <a href="about.html">About me</a>
        <a href="contact.html">Contact us</a>
      </nav>
    </header>

    <main class="house">
      <div class="house-panel house-roof">
        <img src="assets/room-roof-v3.png" alt="" width="1024" height="341" />
        <span class="house-caption">Up on the roof</span>
      </div>

      <div class="house-panel house-living">
        <img src="assets/room-living-v3.png" alt="" width="1024" height="576" />
        <span class="house-caption">Living room</span>
        <button class="room-hotspot living-painting-left" type="button">
          <span class="visually-hidden">A note about the painting on the left</span>
          <span class="room-note">
            It was the first painting that actually moved me, in my life. I
            like the emotion behind it. I like to see her keep going, despite
            the fact that everything she wants is so hard to reach.
          </span>
        </button>
        <button class="room-hotspot living-painting-right" type="button">
          <span class="visually-hidden">A note about the painting on the right</span>
          <span class="room-note">
            I didn’t care for this until I saw it in real life. It was
            mesmerizing
          </span>
        </button>
        <button class="room-hotspot living-drink" type="button">
          <span class="visually-hidden">A note about the piña colada</span>
          <span class="room-note">
            The best drink you can drink and I think only the best Bartenders
            can make it. And I drank the best Pina Colada of my life at
            Attaboy in NYC
          </span>
        </button>
        <button class="room-hotspot living-phone" type="button">
          <span class="visually-hidden">A note about the phone on the table</span>
          <span class="room-note">
            I miss when design looked like this. This was so cool to me,
            because now everything looks the same
          </span>
        </button>
      </div>

      <div class="house-panel house-office">
        <a
          class="room-enter"
          href="work.html?filter=producer"
          aria-label="Producer work"
        >
          <img src="assets/room-office-v3.png" alt="" width="1024" height="1024" />
          <span class="entrance-overlay" aria-hidden="true"></span>
          <span class="entrance-cta" aria-hidden="true">Producer work</span>
        </a>
        <span class="house-caption">Sneha’s office</span>
        <button class="room-hotspot office-hotspot" type="button">
          <span class="visually-hidden">A note about the Twilight poster</span>
          <span class="room-note">
            This is an obsession I can’t shake; it went from ironic to
            unironic and now it is my personality
          </span>
        </button>
      </div>

      <div class="house-panel house-den">
        <a
          class="room-enter"
          href="work.html?filter=writing"
          aria-label="Writing work"
        >
          <img src="assets/room-den-v3.png" alt="" width="1024" height="1024" />
          <span class="entrance-overlay" aria-hidden="true"></span>
          <span class="entrance-cta" aria-hidden="true">Writing work</span>
        </a>
        <span class="house-caption">Sneha’s writing den</span>
      </div>

      <div class="house-panel house-bedroom">
        <a href="about.html">
          <img src="assets/room-bedroom-v4.png" alt="" width="1024" height="576" />
        </a>
        <span class="house-caption">Sneha’s bedroom</span>
      </div>
    </main>
  </body>
</html>
