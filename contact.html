<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact us · Sneha’s Place</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=contact-hug4" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body class="page-inner page-contact">
    <div class="panel panel-nav">
      <a class="logo" href="entrance.html"><img src="assets/logo-script.png" alt="Sneha’s Place" width="950" height="136" /></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-toggle-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="work.html">Work</a>
        <a href="about.html">About me</a>
        <a href="contact.html" aria-current="page">Contact us</a>
      </nav>
    </div>

    <main class="inner-main contact-main">
      <div class="contact-copy">
        <h1 class="visually-hidden">Contact us</h1>
        <p class="lede">
          Ring the doorbell. Say hello, pitch a collaboration, or ask about a
          script.
        </p>
        <form class="contact-form" action="mailto:hello@snehasplace.com" method="post" enctype="text/plain">
          <label>
            Name
            <input type="text" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Subject
            <input type="text" name="subject" required />
          </label>
          <label>
            Message
            <textarea name="message" rows="5" required></textarea>
          </label>
          <button type="submit">Send a note</button>
        </form>
      </div>
      <div class="contact-picture">
        <img
          src="assets/contact-v2.png"
          alt="A picnic blanket with a flip phone, camera, strawberries, cards, a sandwich, and a tote bag"
          width="576"
          height="1024"
        />
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-brand">
        <a class="logo" href="entrance.html"><img src="assets/logo-script.png" alt="Sneha’s Place" width="950" height="136" /></a>
        <p class="footer-desc">A front door and a workspace for screenwriter + producer Sneha Mendes.</p>
      </div>
      <nav class="site-social" aria-label="Social">

        </a>
        <a href="#" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.4 3.2A2.2 2.2 0 1 1 5.4 7.6 2.2 2.2 0 0 1 5.4 3.2ZM3.6 9h3.6v12H3.6zM10.2 9h3.4v1.7h.1c.5-.9 1.6-1.9 3.4-1.9 3.6 0 4.3 2.4 4.3 5.5V21h-3.6v-5.8c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1V21h-3.6z"/></svg>

        </a>

    <script src="js/site-menu.js"></script>
